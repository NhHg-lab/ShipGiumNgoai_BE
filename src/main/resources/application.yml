server:
  port: 8080

spring:
  application:
    name: shipgiumngoai-backend
  datasource:
    url: jdbc:h2:mem:shipgiumngoai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    # 256-bit Base64 secret key for HMAC-SHA256
    secret: U2hpcEdpdW1OZ29haVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZzIwMjZTaGlwR2l1bU5nb2FpVm4=
    expiration-ms: 86400000 # 24 hours
  pricing:
    instant-base-fee: 15000
    flexible-base-fee: 12000
    base-km: 2.0
    per-km-fee: 4500
    platform-fee: 5000
    risk-fund-cut: 1500
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
